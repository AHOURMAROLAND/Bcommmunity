<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!--
    Favicon SVG adaptatif Bakhita Community.
    Affiche l'icone fond blanc en mode clair, fond bleu marine en mode sombre.
    Utilise les vraies images JPEG du dossier public/.
  -->

  <!-- Mode clair : icone B fond blanc -->
  <image xlink:href="/icon-light.jpg"
         x="0" y="0" width="512" height="512"
         preserveAspectRatio="xMidYMid meet">
    <style>
      image { display: block; }
      @media (prefers-color-scheme: dark) { image:first-of-type { display: none; } image:last-of-type { display: block; } }
      @media (prefers-color-scheme: light) { image:first-of-type { display: block; } image:last-of-type { display: none; } }
    </style>
  </image>

  <!-- Mode sombre : icone B fond bleu marine -->
  <image xlink:href="/icon-dark.jpg"
         x="0" y="0" width="512" height="512"
         preserveAspectRatio="xMidYMid meet"
         style="display:none">
  </image>
</svg>
