[project]
name = "bakhita-community-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "CacheControl==0.14.4",
    "celery==5.6.3",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "daphne==4.2.3",
    "dj-database-url==3.1.2",
    "Django==5.2.17",
    "django-cors-headers==4.9.0",
    "django-filter==26.1",
    "django-redis==7.0.0",
    "django-storages[s3]==1.14.6",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-unfold==0.108.0",
    "firebase-admin==7.7.0",
    "google-auth==2.59.1",
    "nh3==0.3.7",
    "phonenumbers==9.0.33",
    "Pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pywebpush==2.5.0",
    "redis==8.1.0",
    "requests==2.34.2",
    "urllib3==2.8.0",
    "whitenoise==6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line length handled by formatter
    "RUF012", # mutable class attributes in Django models/serializers/views
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "RUF012"]
