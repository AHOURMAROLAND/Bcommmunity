services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bakhita
      POSTGRES_USER: bakhita
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defini dans .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakhita"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file: .env
    environment:
      DATABASE_URL: postgres://bakhita:${DB_PASSWORD}@db:5432/bakhita
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: [media:/app/media]
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: celery -A config worker -l info --concurrency 2
    env_file: .env
    environment:
      DATABASE_URL: postgres://bakhita:${DB_PASSWORD}@db:5432/bakhita
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: [media:/app/media]

  beat:
    build: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DATABASE_URL: postgres://bakhita:${DB_PASSWORD}@db:5432/bakhita
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  media:
