services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bakhita
      POSTGRES_USER: bakhita
      POSTGRES_PASSWORD: ${DB_PASSWORD:?défini dans .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakhita"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://bakhita:${DB_PASSWORD}@db:5432/bakhita
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
