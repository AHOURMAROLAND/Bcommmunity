name: Deploy production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Test backend and migration state
        working-directory: backend
        run: |
          pip install -r requirements.txt
          ruff check .
          python manage.py makemigrations --check --dry-run
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run build

  images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/bakhita-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/bakhita-api:latest

      - name: Build and publish Caddy web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.caddy
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_ADMIN_URL=${{ vars.VITE_ADMIN_URL }}
            VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/bakhita-web:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/bakhita-web:latest

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over pinned SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: TAG
          script_stop: true
          script: |
            set -eu
            cd /opt/bakhita
            export TAG
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm migration
            docker compose -f docker-compose.prod.yml up -d \
              --remove-orphans --wait --wait-timeout 180
            docker image prune -f
